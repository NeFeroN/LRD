# Posts a new release to the Telegram groups: @fastbootfirmwareflasher (topic 152) and @gt3neo5hub
# (topic 521). The list is TARGETS below: chat, topic and whether to pin the post.
#
# Runs when a release is published in NeFeroN/LRD. Pre-releases are skipped. By hand (Actions ->
# Telegram release post -> Run workflow) it posts an already published release, by its tag.
#
# The text is the release description: the English part only, after the line "---". Markdown turns
# into Telegram's HTML: ### headings in bold, "- " bullets, **bold**, `code`. The installer is not
# attached (a bot can send 50 MB at most), only linked.
#
# Needs the repository secret TELEGRAM_BOT_TOKEN: the same bot as NeFeroN/FFF. The bot has to be in
# each group, allowed to write to the topic. The groups are independent: if one fails, the others
# still get the post and the run is marked as failed.
# The master copy of this file is in the project: Installer\telegram-release.yml.

name: Telegram release post

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post, e.g. v1.0.1.8"
        required: true

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # [chat, topic, pin the post].
          TARGETS: '[["@fastbootfirmwareflasher", 152, true], ["@gt3neo5hub", 521, true]]'
          TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import html, json, os, re, urllib.error, urllib.request

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          release = event.get("release")
          if not release:
              url = f"https://api.github.com/repos/{os.environ['REPO']}/releases/tags/{os.environ['TAG']}"
              req = urllib.request.Request(url, headers={"User-Agent": "lrd-telegram"})
              release = json.load(urllib.request.urlopen(req))

          body = (release.get("body") or "").replace("\r\n", "\n")
          # The description is in two languages: Russian, then "---", then English. English is taken.
          parts = [p.strip() for p in re.split(r"^\s*-{3,}\s*$", body, flags=re.M) if p.strip()]
          text = parts[-1] if parts else ""

          def inline(s):
              s = html.escape(s, quote=False)
              s = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", s)
              s = re.sub(r"`([^`]+)`", r"<code>\1</code>", s)
              return s

          lines = []
          for raw in text.split("\n"):
              line = raw.strip()
              if not line:
                  continue
              if line.startswith("#"):
                  if lines:
                      lines.append("")
                  lines.append("<b>" + inline(line.lstrip("#").strip()) + "</b>")
              elif line.startswith(("- ", "* ")):
                  lines.append("• " + inline(line[2:]))
              else:
                  lines.append(inline(line))

          # The version in monospace: otherwise Telegram takes "1.0.1.8" for an address and links it.
          title = html.escape(release.get("name") or release.get("tag_name"))
          title = re.sub(r"\bv?\d+(?:\.\d+){1,3}\b", r"<code>\g<0></code>", title)
          # Only the installer's link; without an installer in the release, the release page,
          # so that the post is never left with no link at all.
          links = [f'<a href="{release["html_url"]}">Release page</a>']
          for asset in release.get("assets", []):
              if asset["name"].lower().endswith(".exe"):
                  links = [f'<a href="{asset["browser_download_url"]}">Download installer</a>']
                  break

          message = f"<b>{title}</b>\n\n" + "\n".join(lines) + "\n\n" + " · ".join(links)
          if len(message) > 4096:  # Telegram's limit for one message
              message = message[:4000].rsplit("\n", 1)[0] + "\n…\n\n" + " · ".join(links)

          def call(method, payload):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TOKEN']}/{method}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  answer = json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as e:
                  # Telegram says why in the body: "chat not found", "not enough rights"...
                  raise RuntimeError(f"{method}: HTTP {e.code} {e.read().decode('utf-8', 'replace')[:300]}")
              print(method, json.dumps(answer, ensure_ascii=False)[:300])
              return answer

          failed = []
          for chat_id, thread_id, pin in json.loads(os.environ["TARGETS"]):
              try:
                  sent = call("sendMessage", {
                      "chat_id": chat_id,
                      "message_thread_id": thread_id,
                      "text": message,
                      "parse_mode": "HTML",
                      "link_preview_options": {"is_disabled": True},
                  })
              except Exception as e:
                  # For example, the bot is not in the group or may not write to the topic.
                  print(f"send to {chat_id} failed:", e)
                  failed.append(chat_id)
                  continue

              # Pin the post about the new release, silently: people were already told about the post.
              # If that fails (the bot may not pin), the post is out all the same and the run stands.
              if pin:
                  try:
                      call("pinChatMessage", {
                          "chat_id": chat_id,
                          "message_id": sent["result"]["message_id"],
                          "disable_notification": True,
                      })
                  except Exception as e:
                      print(f"pin in {chat_id} failed:", e)

          if failed:
              raise SystemExit("not sent to: " + ", ".join(failed))
          PY
